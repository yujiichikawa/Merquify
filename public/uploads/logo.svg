<svg xmlns="http://www.w3.org/2000/svg" width="146" height="36" viewBox="0 0 146 36" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3E7BFF"/>
      <stop offset="100%" stop-color="#7A47FF"/>
    </linearGradient>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 L2 3 Z" fill="url(#g1)"/>
    </marker>
  </defs>

  <!-- Ícone preservando proporções reais -->
  <g transform="translate(2, 4) scale(0.62)">
    <!-- Carrinho -->
    <path d="M2 6 L8 6 L18 28 L62 28 L72 28 L80 18 L52 18 L12 18 Z"
          fill="none" stroke="url(#g1)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="22" cy="30" r="4.5" fill="url(#g1)"/>
    <circle cx="54" cy="30" r="4.5" fill="url(#g1)"/>

    <!-- Nós -->
    <circle cx="44" cy="10" r="4" fill="url(#g1)"/>
    <circle cx="36" cy="16" r="4" fill="url(#g1)"/>
    <circle cx="50" cy="18" r="4" fill="url(#g1)"/>

    <!-- Conexões -->
    <line x1="44" y1="10" x2="36" y2="16" stroke="url(#g1)" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="36" y1="16" x2="50" y2="18" stroke="url(#g1)" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="50" y1="18" x2="44" y2="10" stroke="url(#g1)" stroke-width="2.8" stroke-linecap="round"/>

    <!-- Seta -->
    <line x1="42" y1="13" x2="48" y2="13" stroke="url(#g1)" stroke-width="3"
          marker-end="url(#arrow)" stroke-linecap="round"/>
  </g>

  <!-- Texto Merquify alinhado verticalmente -->
  <text x="68" y="23" font-family="Inter, Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="15" fill="#0B2458">
    Merquify
  </text>
</svg>
